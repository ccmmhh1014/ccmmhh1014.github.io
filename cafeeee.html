<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gather — Find your people.</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #f7f7f9;
  --surface: rgba(255,255,255,.82);
  --surface-solid: #ffffff;

  --ink: #151419;
  --sub: #74727c;
  --line: rgba(20,18,25,.075);

  --brand: #6c3bff;
  --brand2: #8c68ff;
  --lime: #b8ff5a;

  --brand-soft: rgba(108,59,255,.10);

  --danger: #ff375f;

  --shadow:
    0 20px 60px rgba(24,18,45,.075);

  --shadow-hover:
    0 30px 90px rgba(33,20,76,.14);

  --radius: 28px;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;

  color: var(--ink);

  background:
    radial-gradient(
      circle at 10% -10%,
      rgba(108,59,255,.16),
      transparent 27%
    ),
    radial-gradient(
      circle at 100% 30%,
      rgba(184,255,90,.12),
      transparent 23%
    ),
    var(--bg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .45;
}

input,
textarea,
select {
  outline: none;
}

.hidden {
  display: none !important;
}


/* ==========================================
   NAVIGATION
========================================== */

nav {
  position: sticky;
  top: 0;
  z-index: 1000;

  height: 72px;

  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);

  background: rgba(247,247,249,.70);

  border-bottom: 1px solid var(--line);
}

.nav-inner {
  width: min(1450px, calc(100% - 40px));
  height: 100%;

  margin: auto;

  display: flex;
  align-items: center;
  gap: 24px;
}

.logo {
  font-weight: 850;
  font-size: 23px;
  letter-spacing: -1.4px;
  white-space: nowrap;
}

.logo-dot {
  color: var(--brand);
}

.search-wrap {
  flex: 1;
  max-width: 600px;
  margin: auto;
  position: relative;
}

.search-wrap input {
  width: 100%;
  height: 44px;

  border: 1px solid transparent;
  border-radius: 999px;

  padding: 0 46px 0 18px;

  background: rgba(255,255,255,.75);

  transition: .25s ease;
}

.search-wrap input:focus {
  background: white;

  border-color:
    rgba(108,59,255,.28);

  box-shadow:
    0 0 0 5px rgba(108,59,255,.08);
}

.search-symbol {
  position: absolute;
  right: 17px;
  top: 11px;

  color: var(--sub);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}

.btn {
  border: 0;
  border-radius: 999px;

  min-height: 42px;

  padding: 0 18px;

  font-weight: 700;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-dark {
  color: white;
  background: var(--ink);
}

.btn-brand {
  color: white;
  background:
    linear-gradient(
      135deg,
      var(--brand),
      #855dff
    );

  box-shadow:
    0 10px 30px rgba(108,59,255,.22);
}

.btn-lime {
  color: #16151a;
  background: var(--lime);
}

.btn-soft {
  color: var(--brand);
  background: var(--brand-soft);
}

.btn-ghost {
  color: var(--ink);
  background: rgba(0,0,0,.04);
}


/* ==========================================
   HERO
========================================== */

.hero {
  width: min(1450px, calc(100% - 40px));
  margin: 34px auto 24px;
}

.hero-card {
  min-height: 310px;

  position: relative;
  overflow: hidden;

  padding: 55px;

  border-radius: 38px;

  color: white;

  background:
    linear-gradient(
      130deg,
      #141219 0%,
      #27183e 50%,
      #4d25c8 100%
    );

  box-shadow: var(--shadow);

  display: flex;
  align-items: flex-end;
}

.hero-orb {
  position: absolute;

  width: 430px;
  height: 430px;

  right: -90px;
  top: -180px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 35%,
      #d1ff7b,
      #8dff5c 22%,
      #7d49ff 59%,
      transparent 72%
    );

  filter: blur(2px);

  animation:
    orb 8s ease-in-out infinite;
}

@keyframes orb {
  50% {
    transform:
      translate(-30px, 35px)
      scale(1.07);
  }
}

.hero-content {
  position: relative;
  z-index: 3;
}

.hero-kicker {
  color: var(--lime);

  font-size: 13px;
  font-weight: 850;
  letter-spacing: 1.2px;

  margin-bottom: 13px;
}

.hero h1 {
  max-width: 790px;

  font-size:
    clamp(42px, 5.5vw, 76px);

  line-height: .96;

  letter-spacing: -4.3px;
}

.hero p {
  max-width: 600px;

  color: rgba(255,255,255,.68);

  line-height: 1.65;

  margin-top: 21px;
}


/* ==========================================
   LAYOUT
========================================== */

.layout {
  width: min(1450px, calc(100% - 40px));

  margin: auto;

  padding-bottom: 80px;

  display: grid;

  grid-template-columns:
    245px minmax(0,1fr) 300px;

  gap: 20px;

  align-items: start;
}

.glass {
  border: 1px solid rgba(255,255,255,.82);

  background: var(--surface);

  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);

  box-shadow: var(--shadow);

  border-radius: var(--radius);
}


/* ==========================================
   SIDEBAR
========================================== */

.sidebar {
  position: sticky;
  top: 92px;

  padding: 17px;
}

.current-cafe {
  padding: 12px 11px 18px;
}

.cafe-logo {
  width: 54px;
  height: 54px;

  border-radius: 18px;

  display: grid;
  place-items: center;

  color: white;

  font-weight: 900;
  font-size: 22px;

  margin-bottom: 15px;

  background:
    linear-gradient(
      140deg,
      var(--brand),
      #311b7b
    );
}

.current-cafe h3 {
  font-size: 18px;
  letter-spacing: -.7px;
}

.current-cafe p {
  margin-top: 5px;

  color: var(--sub);

  font-size: 12px;
  line-height: 1.45;
}

.board-menu {
  margin: 6px 0;
}

.board {
  width: 100%;

  border: 0;
  background: transparent;

  color: #47444e;

  text-align: left;

  border-radius: 15px;

  padding: 12px 13px;

  transition: .2s ease;
}

.board:hover {
  background: rgba(0,0,0,.04);
  transform: translateX(3px);
}

.board.active {
  color: var(--brand);
  background: var(--brand-soft);
  font-weight: 800;
}

.write-btn {
  width: 100%;
  height: 48px;

  border: 0;
  border-radius: 16px;

  margin-top: 13px;

  color: white;

  font-weight: 800;

  background:
    linear-gradient(
      135deg,
      var(--brand),
      #8e64ff
    );

  box-shadow:
    0 12px 30px rgba(108,59,255,.20);

  transition: .25s ease;
}

.write-btn:hover {
  transform: translateY(-3px);

  box-shadow:
    0 18px 40px rgba(108,59,255,.30);
}


/* ==========================================
   MAIN
========================================== */

.content-header {
  min-height: 78px;

  padding: 18px 22px;

  margin-bottom: 14px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 16px;
}

.content-header h2 {
  font-size: 24px;
  letter-spacing: -1px;
}

.content-header small {
  color: var(--sub);
}

.feed {
  display: grid;
  gap: 13px;
}

.post {
  padding: 24px;

  transition:
    transform .28s cubic-bezier(.2,.8,.2,1),
    box-shadow .28s ease;

  cursor: pointer;
}

.post:hover {
  transform: translateY(-5px);

  box-shadow: var(--shadow-hover);
}

.post-author {
  display: flex;
  align-items: center;
  gap: 11px;
}

.avatar {
  width: 40px;
  height: 40px;

  border-radius: 50%;

  display: grid;
  place-items: center;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--brand),
      #9d7aff
    );

  font-size: 14px;
  font-weight: 900;
}

.author-info strong {
  display: block;

  font-size: 13px;
}

.author-info small {
  display: block;

  color: var(--sub);

  margin-top: 3px;
}

.post-title {
  font-size: 21px;

  letter-spacing: -.8px;

  margin-top: 17px;
}

.post-content-preview {
  margin-top: 8px;

  color: var(--sub);

  line-height: 1.65;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
}

.post-meta {
  margin-top: 18px;

  display: flex;
  gap: 18px;

  color: var(--sub);

  font-size: 13px;
}

.post-meta button {
  border: 0;
  background: transparent;
  color: inherit;
}

.post-meta button.liked {
  color: var(--danger);
}


/* ==========================================
   RIGHT BAR
========================================== */

.rightbar {
  position: sticky;
  top: 92px;

  display: grid;
  gap: 14px;
}

.panel {
  padding: 21px;
}

.panel h3 {
  font-size: 16px;

  margin-bottom: 16px;

  letter-spacing: -.5px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat {
  padding: 15px;

  background: rgba(0,0,0,.035);

  border-radius: 17px;
}

.stat strong {
  display: block;

  font-size: 22px;
}

.stat span {
  color: var(--sub);

  font-size: 11px;
}

.cafe-row {
  padding: 11px 0;

  display: flex;
  align-items: center;
  gap: 10px;
}

.cafe-row-info {
  flex: 1;
  min-width: 0;
}

.cafe-row strong {
  display: block;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  font-size: 13px;
}

.cafe-row small {
  color: var(--sub);

  font-size: 11px;
}

.mini-button {
  border: 0;

  border-radius: 999px;

  padding: 7px 11px;

  color: var(--brand);

  background: var(--brand-soft);

  font-size: 11px;
  font-weight: 800;
}


/* ==========================================
   EMPTY
========================================== */

.empty {
  padding: 75px 25px;

  text-align: center;

  color: var(--sub);
}

.empty-symbol {
  width: 62px;
  height: 62px;

  margin: 0 auto 17px;

  display: grid;
  place-items: center;

  border-radius: 22px;

  color: var(--brand);

  background: var(--brand-soft);

  font-size: 25px;
}


/* ==========================================
   MODAL
========================================== */

.modal {
  position: fixed;
  inset: 0;

  z-index: 5000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(18,16,24,.38);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.modal.show {
  display: flex;
}

.modal-card {
  width: min(620px, 100%);

  max-height: 90vh;

  overflow-y: auto;

  padding: 27px;

  border-radius: 30px;

  background: rgba(255,255,255,.96);

  box-shadow:
    0 40px 130px rgba(0,0,0,.28);

  animation:
    modal-in .33s cubic-bezier(.2,.8,.2,1);
}

.modal-card.large {
  width: min(800px, 100%);
}

@keyframes modal-in {
  from {
    opacity: 0;
    transform:
      translateY(25px)
      scale(.975);
  }
}

.modal-titlebar {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 22px;
}

.modal-titlebar h2 {
  letter-spacing: -1px;
}

.close {
  width: 36px;
  height: 36px;

  border: 0;

  border-radius: 50%;

  background: #eeeeF1;

  font-size: 19px;
}

.form {
  display: grid;
  gap: 11px;
}

.field {
  display: grid;
  gap: 7px;
}

.field label {
  padding-left: 3px;

  color: var(--sub);

  font-size: 12px;
  font-weight: 700;
}

.field input,
.field textarea,
.field select {
  width: 100%;

  border: 1px solid transparent;

  border-radius: 16px;

  background: #f1f1f4;

  padding: 14px 15px;

  transition: .2s ease;
}

.field textarea {
  min-height: 180px;

  resize: vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  background: white;

  border-color:
    rgba(108,59,255,.25);

  box-shadow:
    0 0 0 5px rgba(108,59,255,.07);
}

.submit {
  width: 100%;
  height: 49px;

  margin-top: 4px;

  border: 0;
  border-radius: 16px;

  color: white;

  font-weight: 850;

  background:
    linear-gradient(
      135deg,
      var(--brand),
      #8b62ff
    );
}

.auth-switch {
  margin-top: 15px;

  text-align: center;

  color: var(--sub);

  font-size: 13px;
}

.auth-switch button {
  border: 0;
  background: transparent;

  color: var(--brand);

  font-weight: 800;
}


/* ==========================================
   POST DETAIL
========================================== */

.detail-author {
  display: flex;
  align-items: center;
  gap: 12px;

  margin-bottom: 21px;
}

.detail-title {
  font-size: 30px;

  line-height: 1.2;
  letter-spacing: -1.4px;
}

.detail-content {
  margin-top: 19px;

  line-height: 1.8;

  white-space: pre-wrap;

  color: #3e3b44;
}

.detail-actions {
  margin-top: 25px;

  padding: 16px 0;

  display: flex;
  gap: 10px;

  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.comments {
  margin-top: 24px;
}

.comment {
  padding: 14px 0;

  border-bottom: 1px solid var(--line);
}

.comment strong {
  font-size: 13px;
}

.comment small {
  color: var(--sub);

  margin-left: 7px;
}

.comment p {
  margin-top: 7px;

  line-height: 1.55;
}

.comment-form {
  margin-top: 15px;

  display: flex;
  gap: 8px;
}

.comment-form input {
  flex: 1;

  border: 0;
  border-radius: 14px;

  padding: 13px;

  background: #f0f0f3;
}


/* ==========================================
   TOAST
========================================== */

.toast {
  position: fixed;

  z-index: 9999;

  left: 50%;
  bottom: 25px;

  transform:
    translate(-50%, 20px);

  padding: 12px 18px;

  border-radius: 999px;

  color: white;
  background: rgba(20,19,24,.92);

  font-size: 13px;
  font-weight: 650;

  opacity: 0;
  pointer-events: none;

  transition: .25s ease;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%,0);
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width: 1080px) {

  .layout {
    grid-template-columns:
      210px minmax(0,1fr);
  }

  .rightbar {
    display: none;
  }

}

@media(max-width: 760px) {

  .nav-inner,
  .hero,
  .layout {
    width: min(
      100% - 24px,
      1450px
    );
  }

  .search-wrap {
    display: none;
  }

  .hero {
    margin-top: 17px;
  }

  .hero-card {
    min-height: 385px;

    padding: 30px;

    border-radius: 30px;
  }

  .hero h1 {
    letter-spacing: -3px;
  }

  .layout {
    display: block;
  }

  .sidebar {
    position: static;

    margin-bottom: 13px;
  }

  .current-cafe {
    display: none;
  }

  .board-menu {
    display: flex;
    gap: 5px;

    overflow-x: auto;
  }

  .board {
    width: auto;
    white-space: nowrap;
  }

  .write-btn {
    margin-top: 9px;
  }

  .post {
    padding: 19px;
  }

  .content-header {
    padding: 17px;
  }

  .nav-user-name {
    display: none;
  }

}

</style>
</head>


<body>


<nav>

  <div class="nav-inner">

    <div class="logo">
      Gather<span class="logo-dot">●</span>
    </div>


    <div class="search-wrap">

      <input
        id="searchInput"
        placeholder="사람들의 이야기를 검색하세요"
      >

      <span class="search-symbol">⌕</span>

    </div>


    <div class="nav-actions">

      <span
        id="navUserName"
        class="nav-user-name"
      ></span>


      <button
        id="authButton"
        class="btn btn-dark"
      >
        로그인
      </button>

    </div>

  </div>

</nav>



<section class="hero">

  <div class="hero-card">

    <div class="hero-orb"></div>

    <div class="hero-content">

      <div class="hero-kicker">
        GATHER COMMUNITY
      </div>

      <h1>
        Find your people.<br>
        Share what matters.
      </h1>

      <p>
        취향과 관심사를 중심으로 사람들이 모이고,
        더 깊은 이야기를 만들어가는 새로운 커뮤니티.
      </p>

    </div>

  </div>

</section>



<div class="layout">


  <!-- SIDEBAR -->

  <aside class="sidebar glass">

    <section
      id="currentCafe"
      class="current-cafe"
    >

      <div class="cafe-logo">
        G
      </div>

      <h3>Gather</h3>

      <p>
        오른쪽에서 카페를 선택하거나
        새로운 카페를 만들어보세요.
      </p>

    </section>


    <div
      id="boardMenu"
      class="board-menu"
    >

      <button
        class="board active"
        data-board=""
      >
        전체 게시글
      </button>

    </div>


    <button
      id="writeButton"
      class="write-btn"
    >
      + 새 글 작성
    </button>

  </aside>



  <!-- MAIN -->

  <main>

    <section class="content-header glass">

      <div>

        <h2 id="feedTitle">
          새로운 이야기
        </h2>

        <small id="feedSubtitle">
          Gather의 최신 게시글
        </small>

      </div>


      <button
        id="createCafeButton"
        class="btn btn-lime"
      >
        + 카페 만들기
      </button>

    </section>


    <section
      id="feed"
      class="feed"
    >
    </section>

  </main>



  <!-- RIGHT -->

  <aside class="rightbar">


    <section class="panel glass">

      <h3>현재 카페</h3>

      <div class="stats">

        <div class="stat">

          <strong id="memberCount">
            —
          </strong>

          <span>멤버</span>

        </div>


        <div class="stat">

          <strong id="postCount">
            —
          </strong>

          <span>게시글</span>

        </div>

      </div>


      <button
        id="joinCafeButton"
        class="btn btn-brand"
        style="
          width:100%;
          margin-top:12px;
        "
      >
        카페 가입
      </button>

    </section>



    <section class="panel glass">

      <h3>둘러볼 카페</h3>

      <div id="cafeList">
      </div>

    </section>


  </aside>


</div>



<!-- AUTH MODAL -->

<div
  id="authModal"
  class="modal"
>

  <div class="modal-card">

    <div class="modal-titlebar">

      <h2 id="authTitle">
        로그인
      </h2>

      <button
        class="close"
        data-close
      >
        ×
      </button>

    </div>


    <form
      id="authForm"
      class="form"
    >

      <div
        id="usernameField"
        class="field hidden"
      >

        <label>
          닉네임
        </label>

        <input
          id="authUsername"
          maxlength="20"
          placeholder="Gather에서 사용할 이름"
        >

      </div>


      <div class="field">

        <label>
          이메일
        </label>

        <input
          id="authEmail"
          type="email"
          required
          autocomplete="email"
          placeholder="hello@example.com"
        >

      </div>


      <div class="field">

        <label>
          비밀번호
        </label>

        <input
          id="authPassword"
          type="password"
          required
          minlength="6"
          autocomplete="current-password"
          placeholder="6자 이상"
        >

      </div>


      <button
        id="authSubmit"
        class="submit"
      >
        로그인
      </button>

    </form>


    <div class="auth-switch">

      <span id="authSwitchText">
        아직 계정이 없나요?
      </span>

      <button id="authSwitch">
        회원가입
      </button>

    </div>

  </div>

</div>



<!-- CREATE CAFE -->

<div
  id="cafeModal"
  class="modal"
>

  <div class="modal-card">

<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";



/* ========================================================
   SUPABASE CONFIG
======================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL'https://nverktduhrgiwdkxxvzo.supabase.co';

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY'sb_publishable_IlR6IXsH6b5tBjV_u5AJWA_MmIUK8oR';


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* ========================================================
   STATE
======================================================== */

const state = {

  user: null,

  profile: null,

  cafes: [],

  currentCafe: null,

  boards: [],

  currentBoard: null,

  posts: [],

  authMode: "login"

};



/* ========================================================
   DOM
======================================================== */

const $ =
  selector =>
    document.querySelector(selector);


const feed =
  $("#feed");

const cafeList =
  $("#cafeList");

const boardMenu =
  $("#boardMenu");

const authButton =
  $("#authButton");

const writeButton =
  $("#writeButton");

const createCafeButton =
  $("#createCafeButton");

const joinCafeButton =
  $("#joinCafeButton");



/* ========================================================
   UTILS
======================================================== */

function escapeHTML(value = "") {

  const div =
    document.createElement("div");

  div.textContent =
    value;

  return div.innerHTML;

}



function toast(message) {

  const el =
    $("#toast");

  el.textContent =
    message;

  el.classList.add("show");

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () =>
        el.classList.remove("show"),
      2500
    );

}



function openModal(id) {

  $(id).classList.add("show");

  document.body.style.overflow =
    "hidden";

}



function closeModals() {

  document
    .querySelectorAll(".modal")
    .forEach(
      modal =>
        modal.classList.remove("show")
    );

  document.body.style.overflow =
    "";

}



function formatDate(date) {

  return new Intl.DateTimeFormat(
    "ko-KR",
    {
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  ).format(
    new Date(date)
  );

}



function requireLogin() {

  if (state.user)
    return true;

  openAuth();

  toast(
    "로그인이 필요한 기능입니다."
  );

  return false;

}



/* ========================================================
   AUTH
======================================================== */

async function initializeAuth() {

  const {
    data: {
      session
    }
  } =
    await supabase
      .auth
      .getSession();


  state.user =
    session?.user ?? null;


  if (state.user)
    await loadProfile();


  renderAuth();

}



async function loadProfile() {

  const {
    data,
    error
  } =
    await supabase
      .from("profiles")
      .select("*")
      .eq(
        "id",
        state.user.id
      )
      .single();


  if (!error)
    state.profile = data;

}



function renderAuth() {

  if (state.user) {

    authButton.textContent =
      "로그아웃";

    $("#navUserName").textContent =
      state.profile?.username ||
      state.user.email;

  }
  else {

    authButton.textContent =
      "로그인";

    $("#navUserName").textContent =
      "";

  }

}



function openAuth() {

  setAuthMode("login");

  openModal("#authModal");

}



function setAuthMode(mode) {

  state.authMode =
    mode;


  const signup =
    mode === "signup";


  $("#authTitle").textContent =
    signup
      ? "Gather 시작하기"
      : "로그인";


  $("#authSubmit").textContent =
    signup
      ? "회원가입"
      : "로그인";


  $("#usernameField")
    .classList
    .toggle(
      "hidden",
      !signup
    );


  $("#authSwitchText").textContent =
    signup
      ? "이미 계정이 있나요?"
      : "아직 계정이 없나요?";


  $("#authSwitch").textContent =
    signup
      ? "로그인"
      : "회원가입";

}



$("#authSwitch")
  .addEventListener(
    "click",
    () => {

      setAuthMode(
        state.authMode === "login"
          ? "signup"
          : "login"
      );

    }
  );



$("#authForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const email =
        $("#authEmail")
          .value
          .trim();

      const password =
        $("#authPassword")
          .value;

      const username =
        $("#authUsername")
          .value
          .trim();


      if (
        state.authMode ===
        "signup"
      ) {

        if (!username) {

          toast(
            "닉네임을 입력해주세요."
          );

          return;

        }


        const {
          data,
          error
        } =
          await supabase
            .auth
            .signUp({
              email,
              password,

              options: {
                data: {
                  username
                }
              }
            });


        if (error) {

          toast(
            error.message
          );

          return;

        }


        if (!data.session) {

          toast(
            "가입 완료. 이메일 인증 후 로그인해주세요."
          );

          setAuthMode(
            "login"
          );

          return;

        }


        state.user =
          data.user;

        await loadProfile();

        renderAuth();

        closeModals();

        toast(
          "Gather에 오신 것을 환영합니다."
        );

      }

      else {

        const {
          data,
          error
        } =
          await supabase
            .auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {

          toast(
            "이메일 또는 비밀번호를 확인해주세요."
          );

          return;

        }


        state.user =
          data.user;

        await loadProfile();

        renderAuth();

        closeModals();

        await loadCafes();

        toast(
          "로그인되었습니다."
        );

      }

    }
  );



authButton
  .addEventListener(
    "click",
    async () => {

      if (!state.user) {

        openAuth();

        return;

      }


      await supabase
        .auth
        .signOut();


      state.user = null;
      state.profile = null;

      renderAuth();

      toast(
        "로그아웃되었습니다."
      );

    }
  );



supabase
  .auth
  .onAuthStateChange(
    async (
      event,
      session
    ) => {

      state.user =
        session?.user ?? null;

      if (state.user)
        await loadProfile();

      else
        state.profile = null;

      renderAuth();

    }
  );



/* ========================================================
   CAFES
======================================================== */

async function loadCafes() {

  const {
    data,
    error
  } =
    await supabase
      .from("cafes")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    toast(
      "카페를 불러오지 못했습니다."
    );

    return;

  }


  state.cafes =
    data || [];

  renderCafeList();


  if (
    !state.currentCafe &&
    state.cafes.length
  ) {

    await selectCafe(
      state.cafes[0].id
    );

  }

}



function renderCafeList() {

  if (!state.cafes.length) {

    cafeList.innerHTML =
      `
        <div
          style="
            color:var(--sub);
            font-size:13px;
          "
        >
          아직 카페가 없습니다.
        </div>
      `;

    return;

  }


  cafeList.innerHTML =
    state.cafes
      .slice(0,8)
      .map(
        cafe => `

          <div class="cafe-row">

            <div
              class="cafe-logo"
              style="
                width:36px;
                height:36px;
                border-radius:12px;
                margin:0;
                font-size:13px;
              "
            >
              ${escapeHTML(
                cafe.name[0]
                  ?.toUpperCase() ||
                "G"
              )}
            </div>


            <div class="cafe-row-info">

              <strong>
                ${escapeHTML(
                  cafe.name
                )}
              </strong>

              <small>
                ${escapeHTML(
                  cafe.description ||
                  "새로운 커뮤니티"
                )}
              </small>

            </div>


            <button
              class="mini-button"
              data-cafe-id="${cafe.id}"
            >
              열기
            </button>

          </div>

        `
      )
      .join("");

}



cafeList
  .addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          "[data-cafe-id]"
        );

      if (!button)
        return;


      selectCafe(
        button.dataset.cafeId
      );

    }
  );



async function selectCafe(id) {

  const cafe =
    state.cafes.find(
      c => c.id === id
    );


  if (!cafe)
    return;


  state.currentCafe =
    cafe;

  state.currentBoard =
    null;


  $(".current-cafe h3")
    .textContent =
      cafe.name;


  $(".current-cafe p")
    .textContent =
      cafe.description ||
      "Gather의 새로운 커뮤니티";


  $(".cafe-logo")
    .textContent =
      cafe.name[0]
        ?.toUpperCase() ||
      "G";


  $("#feedTitle")
    .textContent =
      cafe.name;


  $("#feedSubtitle")
    .textContent =
      cafe.description ||
      "새로운 이야기를 만나보세요.";


  await Promise.all([
    loadBoards(),
    loadPosts(),
    loadCafeStats(),
    updateJoinButton()
  ]);

}



createCafeButton
  .addEventListener(
    "click",
    () => {

      if (!requireLogin())
        return;

      openModal(
        "#cafeModal"
      );

    }
  );



$("#cafeForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if (!requireLogin())
        return;


      const name =
        $("#cafeName")
          .value
          .trim();

      const slug =
        $("#cafeSlug")
          .value
          .trim()
          .toLowerCase();

      const description =
        $("#cafeDescription")
          .value
          .trim();


      const {
        data,
        error
      } =
        await supabase
          .rpc(
            "create_cafe",
            {
              cafe_name: name,
              cafe_slug: slug,
              cafe_description:
                description
            }
          );


      if (error) {

        if (
          error.message.includes(
            "duplicate"
          )
        ) {

          toast(
            "이미 사용 중인 주소입니다."
          );

        }
        else {

          toast(
            error.message
          );

        }

        return;

      }


      closeModals();

      event.target.reset();

      await loadCafes();

      await selectCafe(data);

      toast(
        "새로운 카페가 만들어졌습니다."
      );

    }
  );



/* ========================================================
   MEMBERSHIP
======================================================== */

async function getMembership() {

  if (
    !state.user ||
    !state.currentCafe
  )
    return null;


  const {
    data
  } =
    await supabase
      .from("memberships")
      .select("*")
      .eq(
        "cafe_id",
        state.currentCafe.id
      )
      .eq(
        "user_id",
        state.user.id
      )
      .maybeSingle();


  return data;

}



async function updateJoinButton() {

  if (!state.currentCafe) {

    joinCafeButton.disabled =
      true;

    return;

  }


  if (!state.user) {

    joinCafeButton.disabled =
      false;

    joinCafeButton.textContent =
      "로그인 후 가입";

    return;

  }


  const membership =
    await getMembership();


  if (membership) {

    joinCafeButton.textContent =
      membership.role === "owner"
        ? "카페 운영자"
        : "가입됨";

    joinCafeButton.disabled =
      true;

  }
  else {

    joinCafeButton.textContent =
      "카페 가입";

    joinCafeButton.disabled =
      false;

  }

}



joinCafeButton
  .addEventListener(
    "click",
    async () => {

      if (!requireLogin())
        return;


      if (!state.currentCafe)
        return;


      const {
        error
      } =
        await supabase
          .from("memberships")
          .insert({
            cafe_id:
              state.currentCafe.id,

            user_id:
              state.user.id,

            role:
              "member"
          });


      if (error) {

        toast(
          error.message
        );

        return;

      }


      toast(
        "카페에 가입했습니다."
      );


      await Promise.all([
        updateJoinButton(),
        loadCafeStats()
      ]);

    }
  );



/* ========================================================
   BOARDS
======================================================== */

async function loadBoards() {

  const {
    data,
    error
  } =
    await supabase
      .from("boards")
      .select("*")
      .eq(
        "cafe_id",
        state.currentCafe.id
      )
      .order(
        "position"
      );


  if (error)
    return;


  state.boards =
    data || [];


  renderBoards();

}



function renderBoards() {

  boardMenu.innerHTML =
    `
      <button
        class="board active"
        data-board=""
      >
        전체 게시글
      </button>

      ${
        state.boards
          .map(
            board => `

              <button
                class="board"
                data-board="${board.id}"
              >
                ${escapeHTML(
                  board.name
                )}
              </button>

            `
          )
          .join("")
      }
    `;


  $("#postBoard")
    .innerHTML =
      state.boards
        .map(
          board => `

            <option
              value="${board.id}"
            >
              ${escapeHTML(
                board.name
              )}
            </option>

          `
        )
        .join("");

}



boardMenu
  .addEventListener(
    "click",
    async event => {

      const button =
        event.target.closest(
          "[data-board]"
        );

      if (!button)
        return;


      boardMenu
        .querySelectorAll(
          ".board"
        )
        .forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      state.currentBoard =
        button.dataset.board ||
        null;


      await loadPosts();

    }
  );



/* ========================================================
   POSTS
======================================================== */

async function loadPosts() {

  if (!state.currentCafe)
    return;


  feed.innerHTML =
    `
      <div class="glass empty">
        게시글을 불러오는 중...
      </div>
    `;


  let query =
    supabase
      .from("posts")
      .select(`
        *,
        profiles!posts_author_id_fkey (
          username,
          avatar_color
        ),
        boards (
          name
        )
      `)
      .eq(
        "cafe_id",
        state.currentCafe.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (state.currentBoard) {

    query =
      query.eq(
        "board_id",
        state.currentBoard
      );

  }


  const {
    data,
    error
  } =
    await query;


  if (error) {

    console.error(error);

    feed.innerHTML =
      `
        <div class="glass empty">
          게시글을 불러올 수 없습니다.
        </div>
      `;

    return;

  }


  state.posts =
    data || [];


  renderPosts();

}



async function renderPosts() {

  const keyword =
    $("#searchInput")
      .value
      .trim()
      .toLowerCase();


  const posts =
    state.posts.filter(
      post =>

        !keyword ||

        post.title
          .toLowerCase()
          .includes(keyword) ||

        post.content
          .toLowerCase()
          .includes(keyword)

    );


  if (!posts.length) {

    feed.innerHTML =
      `
        <div class="glass empty">

          <div class="empty-symbol">
            ✦
          </div>

          <strong>
            아직 이야기가 없어요.
          </strong>

          <p style="margin-top:7px;">
            첫 번째 이야기를 남겨보세요.
          </p>

        </div>
      `;

    return;

  }


  const cards =
    await Promise.all(

      posts.map(
        async post => {

          const [
            likeResult,
            commentResult
          ] =
            await Promise.all([

              supabase
                .from("post_likes")
                .select(
                  "*",
                  {
                    count: "exact",
                    head: true
                  }
                )
                .eq(
                  "post_id",
                  post.id
                ),

              supabase
                .from("comments")
                .select(
                  "*",
                  {
                    count: "exact",
                    head: true
                  }
                )
                .eq(
                  "post_id",
                  post.id
                )

            ]);


          return `

            <article
              class="post glass"
              data-post-id="${post.id}"
            >

              <div class="post-author">

                <div
                  class="avatar"
                  style="
                    background:
                      ${escapeHTML(
                        post.profiles
                          ?.avatar_color ||
                        "#6C3BFF"
                      )};
                  "
                >
                  ${escapeHTML(
                    post.profiles
                      ?.username
                      ?.slice(0,1)
                      ?.toUpperCase() ||
                    "G"
                  )}
                </div>


                <div class="author-info">

                  <strong>
                    ${escapeHTML(
                      post.profiles
                        ?.username ||
                      "Gather member"
                    )}
                  </strong>

                  <small>

                    ${escapeHTML(
                      post.boards
                        ?.name ||
                      "게시판"
                    )}

                    ·

                    ${formatDate(
                      post.created_at
                    )}

                  </small>

                </div>

              </div>


              <h3 class="post-title">

                ${escapeHTML(
                  post.title
                )}

              </h3>


              <p class="post-content-preview">

                ${escapeHTML(
                  post.content
                )}

              </p>


              <div class="post-meta">

                <span>
                  ♡ ${likeResult.count || 0}
                </span>

                <span>
                  ◯ ${commentResult.count || 0}
                </span>

                <span>
                  조회 ${post.view_count || 0}
                </span>

              </div>

            </article>

          `;

        }
      )

    );


  feed.innerHTML =
    cards.join("");

}



writeButton
  .addEventListener(
    "click",
    async () => {

      if (!requireLogin())
        return;


      if (!state.currentCafe) {

        toast(
          "먼저 카페를 선택해주세요."
        );

        return;

      }


      const membership =
        await getMembership();


      if (!membership) {

        toast(
          "글을 작성하려면 카페에 가입해주세요."
        );

        return;

      }


      openModal(
        "#writeModal"
      );

    }
  );



$("#postForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const boardId =
        $("#postBoard").value;

      const title =
        $("#postTitle")
          .value
          .trim();

      const content =
        $("#postContent")
          .value
          .trim();


      const {
        error
      } =
        await supabase
          .from("posts")
          .insert({

            cafe_id:
              state.currentCafe.id,

            board_id:
              boardId,

            author_id:
              state.user.id,

            title,

            content

          });


      if (error) {

        toast(
          error.message
        );

        return;

      }


      event.target.reset();

      closeModals();

      await Promise.all([
        loadPosts(),
        loadCafeStats()
      ]);


      toast(
        "게시글이 등록되었습니다."
      );

    }
  );



/* ========================================================
   POST DETAIL
======================================================== */

feed.addEventListener(
  "click",
  async event => {

    const article =
      event.target.closest(
        "[data-post-id]"
      );

    if (!article)
      return;


    await openPost(
      article.dataset.postId
    );

  }
);



async function openPost(postId) {

  const {
    data: post,
    error
  } =
    await supabase
      .from("posts")
      .select(`
        *,
        profiles!posts_author_id_fkey (
          username,
          avatar_color
        ),
        boards (
          name
        )
      `)
      .eq(
        "id",
        postId
      )
      .single();


  if (error)
    return;


  const {
    data: comments
  } =
    await supabase
      .from("comments")
      .select(`
        *,
        profiles!comments_author_id_fkey (
          username
        )
      `)
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  const {
    count: likeCount
  } =
    await supabase
      .from("post_likes")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "post_id",
        postId
      );


  let liked =
    false;


  if (state.user) {

    const {
      data: myLike
    } =
      await supabase
        .from("post_likes")
        .select("post_id")
        .eq(
          "post_id",
          postId
        )
        .eq(
          "user_id",
          state.user.id
        )
        .maybeSingle();


    liked =
      !!myLike;

  }


  $("#postDetail").innerHTML =
    `

      <div class="detail-author">

        <div
          class="avatar"
          style="
            background:
              ${escapeHTML(
                post.profiles
                  ?.avatar_color ||
                "#6C3BFF"
              )};
          "
        >

          ${escapeHTML(
            post.profiles
              ?.username
              ?.slice(0,1)
              ?.toUpperCase() ||
            "G"
          )}

        </div>


        <div class="author-info">

          <strong>
            ${escapeHTML(
              post.profiles
                ?.username ||
              "Gather member"
            )}
          </strong>

          <small>

            ${escapeHTML(
              post.boards
                ?.name ||
              ""
            )}

            ·

            ${formatDate(
              post.created_at
            )}

          </small>

        </div>

      </div>


      <h1 class="detail-title">

        ${escapeHTML(
          post.title
        )}

      </h1>


      <div class="detail-content">

        ${escapeHTML(
          post.content
        )}

      </div>


      <div class="detail-actions">

        <button
          id="detailLike"
          class="
            btn btn-soft
            ${liked ? "liked" : ""}
          "
        >

          ${liked ? "♥" : "♡"}
          좋아요

          <span>
            ${likeCount || 0}
          </span>

        </button>

      </div>


      <section class="comments">

        <h3>
          댓글 ${comments?.length || 0}
        </h3>


        <div>

          ${
            (comments || [])
              .map(
                comment => `

                  <div class="comment">

                    <strong>
                      ${escapeHTML(
                        comment.profiles
                          ?.username ||
                        "Member"
                      )}
                    </strong>

                    <small>
                      ${formatDate(
                        comment.created_at
                      )}
                    </small>

                    <p>
                      ${escapeHTML(
                        comment.content
                      )}
                    </p>

                  </div>

                `
              )
              .join("")
          }

        </div>


        <form
          id="commentForm"
          class="comment-form"
        >

          <input
            id="commentInput"
            placeholder="댓글을 남겨보세요"
            required
          >

          <button
            class="btn btn-brand"
          >
            등록
          </button>

        </form>

      </section>

    `;


  openModal(
    "#postModal"
  );


  $("#detailLike")
    .addEventListener(
      "click",
      async () => {

        await toggleLike(
          postId
        );

        await openPost(
          postId
        );

      }
    );


  $("#commentForm")
    .addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        if (!requireLogin())
          return;


        const input =
          $("#commentInput");


        const content =
          input.value.trim();


        if (!content)
          return;


        const {
          error
        } =
          await supabase
            .from("comments")
            .insert({

              post_id:
                postId,

              author_id:
                state.user.id,

              content

            });


        if (error) {

          toast(
            error.message
          );

          return;

        }


        input.value = "";


        await openPost(
          postId
        );


        await loadPosts();

      }
    );

}



/* ========================================================
   LIKE
======================================================== */

async function toggleLike(postId) {

  if (!requireLogin())
    return;


  const {
    data
  } =
    await supabase
      .from("post_likes")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        state.user.id
      )
      .maybeSingle();


  if (data) {

    await supabase
      .from("post_likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        state.user.id
      );

  }
  else {

    await supabase
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          state.user.id

      });

  }


  await loadPosts();

}



/* ========================================================
   STATS
======================================================== */

async function loadCafeStats() {

  if (!state.currentCafe)
    return;


  const [
    memberships,
    posts
  ] =
    await Promise.all([

      supabase
        .from("memberships")
        .select(
          "*",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "cafe_id",
          state.currentCafe.id
        ),

      supabase
        .from("posts")
        .select(
          "*",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "cafe_id",
          state.currentCafe.id
        )

    ]);


  $("#memberCount")
    .textContent =
      memberships.count ?? "—";


  $("#postCount")
    .textContent =
      posts.count ?? 0;

}



/* ========================================================
   SEARCH
======================================================== */

$("#searchInput")
  .addEventListener(
    "input",
    () => {

      renderPosts();

    }
  );



/* ========================================================
   MODALS
======================================================== */

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        closeModals
      );

    }
  );


document
  .querySelectorAll(
    ".modal"
  )
  .forEach(
    modal => {

      modal.addEventListener(
        "click",
        event => {

          if (
            event.target === modal
          )
            closeModals();

        }
      );

    }
  );


document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      )
        closeModals();

    }
  );



/* ========================================================
   START
======================================================== */

async function start() {

  if (
    SUPABASE_URL.includes(
      "YOUR_"
    ) ||
    SUPABASE_KEY.includes(
      "YOUR_"
    )
  ) {

    feed.innerHTML =
      `

        <div class="glass empty">

          <div class="empty-symbol">
            ⚙
          </div>

          <strong>
            Supabase 연결이 필요합니다.
          </strong>

          <p style="
            margin-top:8px;
            line-height:1.6;
          ">

            index.html의
            SUPABASE_URL과
            SUPABASE_KEY를
            입력해주세요.

          </p>

        </div>

      `;

    return;

  }


  await initializeAuth();

  await loadCafes();

}


start();

</script>
