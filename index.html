<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store. — 프리미엄 라이프스타일 쇼핑</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --text:#1d1d1f;
    --text-secondary:#6e6e73;
    --accent:#0071e3;
    --accent-dark:#0058b3;
    --border:#e5e5e7;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 4px rgba(0,0,0,0.08);
    --shadow-lg:0 8px 30px rgba(0,0,0,0.14);
    --transition:0.2s ease;
    --danger:#ff3b30;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html{-webkit-font-smoothing:antialiased;}

  body{
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.45;
    min-height:100vh;
    padding-bottom:60px;
  }

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  img,svg{display:block;}

  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(255,255,255,0.82);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--border);
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:20px;
  }

  .logo{
    font-size:21px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--text);
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:2px;
  }
  .logo span{color:var(--accent);}

  .search-wrap{
    flex:1;
    max-width:520px;
    position:relative;
  }

  .search-wrap input{
    width:100%;
    padding:10px 16px 10px 40px;
    border-radius:980px;
    border:none;
    background:var(--bg);
    font-size:14px;
    color:var(--text);
    transition:var(--transition);
  }
  .search-wrap input:focus{
    background:#ececee;
    outline:none;
    box-shadow:0 0 0 3px rgba(0,113,227,0.18);
  }
  .search-wrap input::placeholder{color:var(--text-secondary);}

  .search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--text-secondary);
    pointer-events:none;
  }

  .header-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .icon-btn{
    position:relative;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    transition:var(--transition);
    color:var(--text);
  }
  .icon-btn:hover{background:var(--bg);}
  .icon-btn svg{width:21px;height:21px;}

  .cart-badge{
    position:absolute;
    top:2px;
    right:2px;
    min-width:16px;
    height:16px;
    padding:0 4px;
    border-radius:999px;
    background:var(--danger);
    color:#fff;
    font-size:10px;
    font-weight:700;
    line-height:16px;
    text-align:center;
    transform:scale(1);
    transition:transform 0.15s ease;
  }
  .cart-badge.pulse{animation:pulse 0.3s ease;}
  @keyframes pulse{
    0%{transform:scale(1);}
    40%{transform:scale(1.35);}
    100%{transform:scale(1);}
  }
  .cart-badge.hidden{display:none;}

  /* ---------- Main ---------- */
  main{
    max-width:1200px;
    margin:0 auto;
    padding:36px 24px 0;
  }

  .page-title{
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin-bottom:4px;
  }
  .page-subtitle{
    font-size:14px;
    color:var(--text-secondary);
    margin-bottom:28px;
  }

  .product-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
  }

  @media (min-width:600px){
    .product-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (min-width:1024px){
    .product-grid{grid-template-columns:repeat(4,1fr);}
  }

  .product-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:transform var(--transition), box-shadow var(--transition);
    display:flex;
    flex-direction:column;
    cursor:pointer;
  }
  .product-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-lg);
  }

  .product-img{
    aspect-ratio:1/1;
    width:100%;
    background:#e8e8ed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    text-align:center;
  }
  .product-img span{
    font-size:13px;
    font-weight:600;
    color:#a1a1a6;
    letter-spacing:-0.01em;
  }

  .product-info{
    padding:16px 16px 18px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }

  .product-name{
    font-size:15px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--text);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:38px;
  }

  .product-rating{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    color:var(--text-secondary);
  }
  .product-rating .stars{color:#ff9f0a;letter-spacing:1px;font-size:12px;}

  .product-price{
    font-size:17px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin-top:2px;
  }

  .product-actions{
    margin-top:auto;
    padding-top:10px;
  }

  .btn-add{
    width:100%;
    padding:10px 0;
    border-radius:980px;
    background:var(--bg);
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    transition:var(--transition);
  }
  .btn-add:hover{background:var(--accent);color:#fff;}

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:80px 20px;
    color:var(--text-secondary);
    font-size:15px;
  }

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    opacity:0;
    pointer-events:none;
    transition:opacity var(--transition);
    z-index:50;
  }
  .overlay.active{opacity:1;pointer-events:auto;}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-48%) scale(0.96);
    width:min(760px, 92vw);
    max-height:88vh;
    overflow-y:auto;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow-lg);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity var(--transition), transform var(--transition);
  }
  .modal.active{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
  }

  .modal-close{
    position:absolute;
    top:16px;
    right:16px;
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:var(--transition);
    z-index:2;
  }
  .modal-close:hover{background:#e2e2e5;}
  .modal-close svg{width:15px;height:15px;}

  .modal-body{
    display:grid;
    grid-template-columns:1fr;
  }
  @media (min-width:640px){
    .modal-body{grid-template-columns:1fr 1fr;}
  }

  .modal-img{
    aspect-ratio:1/1;
    background:#e8e8ed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    text-align:center;
    border-radius:20px 20px 0 0;
  }
  @media (min-width:640px){
    .modal-img{border-radius:20px 0 0 20px;}
  }
  .modal-img span{font-size:16px;font-weight:600;color:#a1a1a6;}

  .modal-details{
    padding:28px 28px 32px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .modal-name{font-size:20px;font-weight:700;letter-spacing:-0.02em;padding-right:20px;}

  .modal-rating{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--text-secondary);
  }
  .modal-rating .stars{color:#ff9f0a;}

  .modal-price{font-size:24px;font-weight:700;letter-spacing:-0.02em;}

  .field-label{
    font-size:12px;
    font-weight:600;
    color:var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin-bottom:8px;
  }

  .option-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .option-chip{
    padding:9px 16px;
    border-radius:980px;
    border:1px solid var(--border);
    font-size:13px;
    font-weight:500;
    color:var(--text);
    background:#fff;
    transition:var(--transition);
  }
  .option-chip:hover{border-color:var(--accent);}
  .option-chip.selected{
    background:var(--text);
    border-color:var(--text);
    color:#fff;
  }

  .qty-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .qty-stepper{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:980px;
    overflow:hidden;
  }
  .qty-stepper button{
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color:var(--text);
    transition:var(--transition);
  }
  .qty-stepper button:hover{background:var(--bg);}
  .qty-stepper span{
    width:36px;
    text-align:center;
    font-size:14px;
    font-weight:600;
  }

  .modal-footer{
    margin-top:auto;
    padding-top:16px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .modal-total-label{font-size:13px;color:var(--text-secondary);}
  .modal-total-price{font-size:19px;font-weight:700;}

  .btn-primary{
    width:100%;
    padding:14px 0;
    border-radius:980px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    transition:var(--transition);
  }
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:active{transform:scale(0.98);}

  /* ---------- Cart Drawer ---------- */
  .drawer{
    position:fixed;
    top:0;
    right:0;
    height:100%;
    width:min(400px, 92vw);
    background:var(--card);
    box-shadow:-4px 0 24px rgba(0,0,0,0.12);
    z-index:60;
    transform:translateX(100%);
    transition:transform 0.3s ease;
    display:flex;
    flex-direction:column;
  }
  .drawer.active{transform:translateX(0);}

  .drawer-header{
    padding:20px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .drawer-title{font-size:18px;font-weight:700;letter-spacing:-0.01em;}

  .drawer-items{
    flex:1;
    overflow-y:auto;
    padding:8px 22px;
  }

  .cart-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    color:var(--text-secondary);
    gap:10px;
    text-align:center;
    padding:40px 20px;
  }
  .cart-empty svg{width:44px;height:44px;color:#d2d2d7;}
  .cart-empty p{font-size:14px;}

  .cart-item{
    display:flex;
    gap:12px;
    padding:16px 0;
    border-bottom:1px solid var(--border);
  }
  .cart-item:last-child{border-bottom:none;}

  .cart-item-img{
    width:64px;
    height:64px;
    border-radius:var(--radius-sm);
    background:#e8e8ed;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    text-align:center;
  }
  .cart-item-img span{font-size:9px;font-weight:600;color:#a1a1a6;line-height:1.2;}

  .cart-item-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .cart-item-name{font-size:13.5px;font-weight:600;letter-spacing:-0.01em;}
  .cart-item-option{font-size:12px;color:var(--text-secondary);}

  .cart-item-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:4px;
  }

  .cart-item-price{font-size:13.5px;font-weight:700;}

  .mini-stepper{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:980px;
    overflow:hidden;
  }
  .mini-stepper button{
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    transition:var(--transition);
  }
  .mini-stepper button:hover{background:var(--bg);}
  .mini-stepper span{width:24px;text-align:center;font-size:12.5px;font-weight:600;}

  .cart-item-remove{
    color:var(--text-secondary);
    font-size:11.5px;
    padding:4px 0;
    transition:var(--transition);
  }
  .cart-item-remove:hover{color:var(--danger);}

  .drawer-footer{
    padding:18px 22px 24px;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .drawer-summary-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13.5px;
    color:var(--text-secondary);
  }
  .drawer-summary-row.total{
    font-size:16px;
    font-weight:700;
    color:var(--text);
    padding-top:6px;
    border-top:1px solid var(--border);
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    bottom:32px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(29,29,31,0.92);
    backdrop-filter:blur(10px);
    color:#fff;
    padding:13px 22px;
    border-radius:980px;
    font-size:13.5px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:8px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    white-space:nowrap;
  }
  .toast.active{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .toast svg{width:16px;height:16px;color:#30d158;flex-shrink:0;}

  @media (max-width:480px){
    .header-inner{padding:12px 16px;gap:10px;}
    .logo{font-size:18px;}
    main{padding:24px 16px 0;}
    .page-title{font-size:22px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Store<span>.</span></div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="상품 검색" autocomplete="off">
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="cartBtn" aria-label="장바구니 열기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4.5 3H2"/><circle cx="9.5" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17.5" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
        <span class="cart-badge hidden" id="cartBadge">0</span>
      </button>
    </div>
  </div>
</header>

<main>
  <h1 class="page-title">오늘의 추천</h1>
  <p class="page-subtitle">엄선된 라이프스타일 아이템을 만나보세요</p>
  <div class="product-grid" id="productGrid"></div>
</main>

<div class="overlay" id="overlay"></div>

<div class="modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="modalName">
  <button class="modal-close" id="modalCloseBtn" aria-label="닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
  </button>
  <div class="modal-body">
    <div class="modal-img" id="modalImg"><span></span></div>
    <div class="modal-details">
      <div>
        <h2 class="modal-name" id="modalName"></h2>
        <div class="modal-rating" id="modalRating"></div>
      </div>
      <div class="modal-price" id="modalPrice"></div>

      <div>
        <div class="field-label">옵션 선택</div>
        <div class="option-list" id="optionList"></div>
      </div>

      <div>
        <div class="field-label">수량</div>
        <div class="qty-row">
          <div class="qty-stepper">
            <button id="qtyMinus" aria-label="수량 감소">−</button>
            <span id="qtyValue">1</span>
            <button id="qtyPlus" aria-label="수량 증가">+</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div>
          <div class="modal-total-label">총 합계</div>
          <div class="modal-total-price" id="modalTotal"></div>
        </div>
      </div>
      <button class="btn-primary" id="modalAddBtn">장바구니 담기</button>
    </div>
  </div>
</div>

<aside class="drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="장바구니">
  <div class="drawer-header">
    <div class="drawer-title">장바구니</div>
    <button class="modal-close" id="drawerCloseBtn" aria-label="닫기" style="position:static;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
    </button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-footer" id="drawerFooter">
    <div class="drawer-summary-row">
      <span>총 수량</span>
      <span id="summaryQty">0개</span>
    </div>
    <div class="drawer-summary-row total">
      <span>총 결제금액</span>
      <span id="summaryTotal">0원</span>
    </div>
    <button class="btn-primary" id="orderBtn">주문하기</button>
  </div>
</aside>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastMsg">담았습니다</span>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Demo product data ---------- */
  var PRODUCTS = [
    { id:1, name:"무선 이어폰 프로", price:129000, rating:4.8, reviews:2140, options:["블랙","화이트"] },
    { id:2, name:"미니멀 레더 백팩", price:89000, rating:4.6, reviews:854, options:["블랙","브라운","베이지"] },
    { id:3, name:"스마트워치 우븐 밴드", price:39000, rating:4.4, reviews:412, options:["미드나이트","스타라이트","레드"] },
    { id:4, name:"캐시미어 크루넥 니트", price:159000, rating:4.9, reviews:1320, options:["오트밀","차콜","네이비"] },
    { id:5, name:"알루미늄 노트북 스탠드", price:49000, rating:4.7, reviews:998, options:["실버","스페이스그레이"] },
    { id:6, name:"세라믹 머그컵 2P 세트", price:32000, rating:4.5, reviews:376, options:["화이트","샌드"] },
    { id:7, name:"맥세이프 무선 충전패드", price:45000, rating:4.3, reviews:660, options:["화이트"] },
    { id:8, name:"프리미엄 스테인리스 텀블러", price:28000, rating:4.6, reviews:1890, options:["블랙","실버","핑크"] },
    { id:9, name:"가죽 데스크 매트", price:35000, rating:4.7, reviews:245, options:["브라운","블랙"] },
    { id:10, name:"오가닉 코튼 후드티", price:69000, rating:4.4, reviews:530, options:["그레이","블랙","크림"] },
    { id:11, name:"포터블 블루투스 스피커", price:99000, rating:4.8, reviews:1745, options:["블랙","블루"] },
    { id:12, name:"가죽 카드 반지갑", price:55000, rating:4.5, reviews:301, options:["블랙","브라운","와인"] }
  ];

  var CART_KEY = "smartstore_cart_v1";

  /* ---------- State ---------- */
  var cart = loadCart();
  var currentProduct = null;
  var currentOption = null;
  var currentQty = 1;
  var toastTimer = null;

  /* ---------- Helpers ---------- */
  function money(n){
    return n.toLocaleString("ko-KR") + "원";
  }

  function starString(rating){
    var full = Math.round(rating);
    var str = "";
    for(var i=0;i<5;i++){ str += (i < full) ? "★" : "☆"; }
    return str;
  }

  function findProduct(id){
    for(var i=0;i<PRODUCTS.length;i++){
      if(PRODUCTS[i].id === id) return PRODUCTS[i];
    }
    return null;
  }

  function loadCart(){
    try{
      var raw = localStorage.getItem(CART_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function saveCart(){
    try{
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }catch(e){ /* storage unavailable — ignore */ }
  }

  /* ---------- Product Grid ---------- */
  var productGrid = document.getElementById("productGrid");

  function renderProducts(filterText){
    var q = (filterText || "").trim().toLowerCase();
    var list = PRODUCTS.filter(function(p){
      return p.name.toLowerCase().indexOf(q) !== -1;
    });

    if(list.length === 0){
      productGrid.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
      return;
    }

    var html = "";
    for(var i=0;i<list.length;i++){
      var p = list[i];
      html +=
        '<div class="product-card" data-id="'+p.id+'">' +
          '<div class="product-img"><span>'+escapeHtml(p.name)+'</span></div>' +
          '<div class="product-info">' +
            '<div class="product-name">'+escapeHtml(p.name)+'</div>' +
            '<div class="product-rating"><span class="stars">'+starString(p.rating)+'</span><span>'+p.rating.toFixed(1)+' ('+p.reviews.toLocaleString("ko-KR")+')</span></div>' +
            '<div class="product-price">'+money(p.price)+'</div>' +
            '<div class="product-actions"><button class="btn-add" data-quickadd="'+p.id+'">담기</button></div>' +
          '</div>' +
        '</div>';
    }
    productGrid.innerHTML = html;
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  productGrid.addEventListener("click", function(e){
    var quickBtn = e.target.closest("[data-quickadd]");
    if(quickBtn){
      e.stopPropagation();
      var id = parseInt(quickBtn.getAttribute("data-quickadd"), 10);
      var p = findProduct(id);
      if(p){
        addToCart(p, p.options[0], 1);
        showToast(p.name + " 담았습니다");
      }
      return;
    }
    var card = e.target.closest(".product-card");
    if(card){
      var pid = parseInt(card.getAttribute("data-id"), 10);
      openModal(pid);
    }
  });

  var searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", function(){
    renderProducts(searchInput.value);
  });

  /* ---------- Overlay ---------- */
  var overlay = document.getElementById("overlay");

  function showOverlay(){ overlay.classList.add("active"); }
  function hideOverlayIfIdle(){
    if(!modal.classList.contains("active") && !drawer.classList.contains("active")){
      overlay.classList.remove("active");
    }
  }

  overlay.addEventListener("click", function(){
    closeModal();
    closeDrawer();
  });

  /* ---------- Modal ---------- */
  var modal = document.getElementById("productModal");
  var modalImg = document.getElementById("modalImg").querySelector("span");
  var modalName = document.getElementById("modalName");
  var modalRating = document.getElementById("modalRating");
  var modalPrice = document.getElementById("modalPrice");
  var optionList = document.getElementById("optionList");
  var qtyValue = document.getElementById("qtyValue");
  var modalTotal = document.getElementById("modalTotal");
  var modalAddBtn = document.getElementById("modalAddBtn");

  function openModal(id){
    var p = findProduct(id);
    if(!p) return;
    currentProduct = p;
    currentOption = p.options[0];
    currentQty = 1;

    modalImg.textContent = p.name;
    modalName.textContent = p.name;
    modalRating.innerHTML = '<span class="stars">'+starString(p.rating)+'</span><span>'+p.rating.toFixed(1)+' ('+p.reviews.toLocaleString("ko-KR")+'개 리뷰)</span>';
    modalPrice.textContent = money(p.price);

    renderOptionList();
    updateQtyAndTotal();

    modal.classList.add("active");
    showOverlay();
    document.body.style.overflow = "hidden";
  }

  function renderOptionList(){
    var html = "";
    for(var i=0;i<currentProduct.options.length;i++){
      var opt = currentProduct.options[i];
      var selected = (opt === currentOption) ? " selected" : "";
      html += '<button class="option-chip'+selected+'" data-option="'+escapeHtml(opt)+'">'+escapeHtml(opt)+'</button>';
    }
    optionList.innerHTML = html;
  }

  optionList.addEventListener("click", function(e){
    var chip = e.target.closest(".option-chip");
    if(!chip) return;
    currentOption = chip.getAttribute("data-option");
    renderOptionList();
  });

  document.getElementById("qtyMinus").addEventListener("click", function(){
    if(currentQty > 1){ currentQty--; updateQtyAndTotal(); }
  });
  document.getElementById("qtyPlus").addEventListener("click", function(){
    if(currentQty < 99){ currentQty++; updateQtyAndTotal(); }
  });

  function updateQtyAndTotal(){
    qtyValue.textContent = currentQty;
    modalTotal.textContent = money(currentProduct.price * currentQty);
  }

  modalAddBtn.addEventListener("click", function(){
    addToCart(currentProduct, currentOption, currentQty);
    showToast(currentProduct.name + " 담았습니다");
    closeModal();
  });

  function closeModal(){
    modal.classList.remove("active");
    document.body.style.overflow = "";
    hideOverlayIfIdle();
  }

  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);

  /* ---------- Cart logic ---------- */
  function cartKey(productId, option){
    return productId + "::" + option;
  }

  function addToCart(product, option, qty){
    var key = cartKey(product.id, option);
    var existing = null;
    for(var i=0;i<cart.length;i++){
      if(cart[i].key === key){ existing = cart[i]; break; }
    }
    if(existing){
      existing.qty += qty;
    } else {
      cart.push({
        key:key,
        productId:product.id,
        name:product.name,
        price:product.price,
        option:option,
        qty:qty
      });
    }
    saveCart();
    renderCartBadge();
    renderDrawer();
  }

  function changeCartQty(key, delta){
    for(var i=0;i<cart.length;i++){
      if(cart[i].key === key){
        cart[i].qty += delta;
        if(cart[i].qty < 1){ cart[i].qty = 1; }
        break;
      }
    }
    saveCart();
    renderCartBadge();
    renderDrawer();
  }

  function removeFromCart(key){
    cart = cart.filter(function(item){ return item.key !== key; });
    saveCart();
    renderCartBadge();
    renderDrawer();
    showToast("삭제되었습니다");
  }

  function cartTotalQty(){
    var total = 0;
    for(var i=0;i<cart.length;i++){ total += cart[i].qty; }
    return total;
  }

  function cartTotalPrice(){
    var total = 0;
    for(var i=0;i<cart.length;i++){ total += cart[i].qty * cart[i].price; }
    return total;
  }

  var cartBadge = document.getElementById("cartBadge");
  function renderCartBadge(){
    var qty = cartTotalQty();
    cartBadge.textContent = qty > 99 ? "99+" : qty;
    if(qty > 0){
      cartBadge.classList.remove("hidden");
      cartBadge.classList.add("pulse");
      setTimeout(function(){ cartBadge.classList.remove("pulse"); }, 300);
    } else {
      cartBadge.classList.add("hidden");
    }
  }

  /* ---------- Cart Drawer ---------- */
  var drawer = document.getElementById("cartDrawer");
  var drawerItems = document.getElementById("drawerItems");
  var drawerFooter = document.getElementById("drawerFooter");
  var summaryQty = document.getElementById("summaryQty");
  var summaryTotal = document.getElementById("summaryTotal");

  function renderDrawer(){
    if(cart.length === 0){
      drawerItems.innerHTML =
        '<div class="cart-empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4.5 3H2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>' +
          '<p>장바구니가 비어 있습니다</p>' +
        '</div>';
      drawerFooter.style.display = "none";
      return;
    }

    drawerFooter.style.display = "flex";
    var html = "";
    for(var i=0;i<cart.length;i++){
      var item = cart[i];
      html +=
        '<div class="cart-item">' +
          '<div class="cart-item-img"><span>'+escapeHtml(item.name)+'</span></div>' +
          '<div class="cart-item-info">' +
            '<div class="cart-item-name">'+escapeHtml(item.name)+'</div>' +
            '<div class="cart-item-option">옵션: '+escapeHtml(item.option)+'</div>' +
            '<div class="cart-item-bottom">' +
              '<div class="mini-stepper">' +
                '<button data-action="minus" data-key="'+item.key+'" aria-label="수량 감소">−</button>' +
                '<span>'+item.qty+'</span>' +
                '<button data-action="plus" data-key="'+item.key+'" aria-label="수량 증가">+</button>' +
              '</div>' +
              '<div class="cart-item-price">'+money(item.price * item.qty)+'</div>' +
            '</div>' +
            '<button class="cart-item-remove" data-action="remove" data-key="'+item.key+'">삭제</button>' +
          '</div>' +
        '</div>';
    }
    drawerItems.innerHTML = html;

    summaryQty.textContent = cartTotalQty().toLocaleString("ko-KR") + "개";
    summaryTotal.textContent = money(cartTotalPrice());
  }

  drawerItems.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");
    var key = btn.getAttribute("data-key");
    if(action === "plus"){ changeCartQty(key, 1); }
    else if(action === "minus"){ changeCartQty(key, -1); }
    else if(action === "remove"){ removeFromCart(key); }
  });

  function openDrawer(){
    renderDrawer();
    drawer.classList.add("active");
    showOverlay();
    document.body.style.overflow = "hidden";
  }

  function closeDrawer(){
    drawer.classList.remove("active");
    document.body.style.overflow = "";
    hideOverlayIfIdle();
  }

  document.getElementById("cartBtn").addEventListener("click", openDrawer);
  document.getElementById("drawerCloseBtn").addEventListener("click", closeDrawer);

  document.getElementById("orderBtn").addEventListener("click", function(){
    if(cart.length === 0) return;
    showToast("주문이 완료되었습니다");
    cart = [];
    saveCart();
    renderCartBadge();
    renderDrawer();
    closeDrawer();
  });

  /* ---------- Toast ---------- */
  var toast = document.getElementById("toast");
  var toastMsg = document.getElementById("toastMsg");

  function showToast(msg){
    toastMsg.textContent = msg;
    toast.classList.add("active");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toast.classList.remove("active");
    }, 2000);
  }

  /* ---------- Escape key ---------- */
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      closeModal();
      closeDrawer();
    }
  });

  /* ---------- Init ---------- */
  renderProducts("");
  renderCartBadge();
  renderDrawer();

})();
</script>
</body>
</html>
